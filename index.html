<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Revela</title>
<link rel="icon" href="icone.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icone-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#141210">
<style>
  :root {
    --bg: #0b0b0a; --panel: #121211; --raise: #1c1b19; --line: #262522; --text: #f1ece3; --muted: #8d877d; --faint: #5d5850;
    --accent: #e8dcc6; --safe-b: env(safe-area-inset-bottom, 0px); --safe-t: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 14px/1.4 -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; overscroll-behavior: none; }
  body { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; grid-template-columns: minmax(0, 1fr); height: 100dvh; overflow: hidden; }
  header, #palco, #painel, .conteudo, .pag { min-width: 0; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  button:disabled { opacity: .3; cursor: default; }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; display: block; }

  header { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + var(--safe-t)) 14px 6px; gap: 8px; }
  header .grp { display: flex; gap: 4px; align-items: center; }
  .ib { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 50%; }
  .ib:active { background: var(--raise); }
  .marca { font-weight: 600; letter-spacing: .32em; font-size: 12px; color: var(--muted); padding-left: 4px; }
  .exportar { background: var(--accent); color: #17140f; font-weight: 600; padding: 9px 18px; border-radius: 999px; font-size: 14px; }
  /* celular estreito (ex.: Moto Edge 50 Neo, 360–400 px): com a foto aberta, o nome sai do topo para tudo caber */
  @media (max-width: 480px) {
    body.com-foto .marca { display: none; }
    header .grp { gap: 0; }
    .ib { width: 38px; }
    .exportar { padding: 9px 14px; }
  }

  #palco { position: relative; display: grid; place-items: center; overflow: hidden; padding: 4px 14px 14px; touch-action: none; min-height: 0; }
  #tela { max-width: 100%; max-height: 100%; display: none; box-shadow: 0 8px 40px #0008; }
  #vazio { text-align: center; color: var(--muted); max-width: 300px; display: grid; gap: 16px; justify-items: center; }
  #vazio h1 { margin: 0; font-weight: 500; font-size: 30px; letter-spacing: .28em; color: var(--text); }
  #vazio p { margin: 0; }
  #vazio button { border: 1px solid var(--line); padding: 12px 22px; border-radius: 999px; color: var(--text); }
  #anel { position: absolute; display: none; border: 1.5px dashed #fff9; border-radius: 50%; pointer-events: none; box-shadow: 0 0 0 1px #0006; }
  #selo { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); background: #000a; color: #fff; font-size: 12px;
    padding: 4px 12px; border-radius: 999px; display: none; letter-spacing: .06em; }
  .versao { display: block; margin-top: 18px; color: var(--faint); font-size: 11px; letter-spacing: .06em; }
  #pergunta { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: none; align-items: center; gap: 14px;
    background: var(--raise); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 10px 16px; font-size: 13px; width: max-content; max-width: calc(100% - 32px); box-shadow: 0 8px 30px #0008;  z-index: 12; }
  #pergunta div { display: flex; gap: 6px; } #pergunta button { padding: 9px 14px; border-radius: 10px; color: var(--muted); font-size: 13px; }
  #pergunta button.on { background: var(--text); color: var(--bg, #111); font-weight: 600; }
  #aviso { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); background: #000c; color: #fff; padding: 8px 14px;
    border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity .25s; pointer-events: none; max-width: 90%; text-align: center; }

  body:not(.com-foto) #painel, body:not(.com-foto) header .grp:last-child { visibility: hidden; }   /* antes da foto: só as boas-vindas */
  #painel { background: var(--panel); padding-bottom: calc(6px + var(--safe-b)); border-top: 1px solid var(--line); }
  .abas { display: flex; justify-content: center; gap: 28px; padding: 10px 0 2px; }
  .abas button { color: var(--faint); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; padding: 6px 0; }
  .abas button.on { color: var(--text); }
  .conteudo { min-height: 170px; }
  .pag { display: none; } .pag.on { display: block; }

  .cats { display: flex; gap: 18px; padding: 8px 16px 10px; overflow-x: auto; scrollbar-width: none; }
  .cats::-webkit-scrollbar, .faixa::-webkit-scrollbar { display: none; }
  .cats button { color: var(--muted); font-size: 13px; white-space: nowrap; }
  .cats button.on { color: var(--text); }
  .faixa { display: flex; gap: 10px; overflow-x: auto; padding: 5px 16px 8px; scrollbar-width: none; }   /* 5 px em cima: a borda do filme escolhido fica 4 px para fora e não pode ser cortada */
  .film { flex: 0 0 auto; width: 74px; display: grid; gap: 6px; justify-items: center; color: var(--muted); font-size: 11.5px; }
  .film canvas, .film .ph { width: 74px; height: 74px; border-radius: 6px; object-fit: cover; background: var(--raise); display: block; outline: 2px solid transparent; outline-offset: 2px; }
  .film.on { color: var(--text); } .film.on canvas, .film.on .ph { outline-color: var(--accent); }
  .film .ph { display: grid; place-items: center; color: var(--faint); font-size: 11px; }
  .nota { overflow-wrap: anywhere; padding: 2px 18px 0; color: var(--muted); font-size: 12px; min-height: 18px; }

  .ctl { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 7px 18px; }
  .ctl label { font-size: 13px; color: var(--text); }
  .ctl output { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ctl input { grid-column: 1 / -1; width: 100%; }
  .escolha { padding: 8px 18px; display: grid; gap: 6px; } .escolha small { color: var(--muted); font-size: 11.5px; }
  .escolha div { display: flex; gap: 6px; } .escolha button { flex: 1; padding: 7px 4px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; }
  .escolha button.on { color: var(--text); border-color: var(--accent); }
  .escolha label { font-size: 13px; color: var(--text); }
  /* barra (como no RNI): o trecho entre o zero e o botão fica aceso; nas barras de dois lados, um pontinho marca o zero */
  input[type=range].bi { background: radial-gradient(circle at calc(9px + (100% - 18px) * var(--z, .5)) 50%, var(--muted) 0 2.5px, transparent 3px) no-repeat; }
  .dado { width: 32px; height: 32px; margin: -6px 0; display: grid; place-items: center; border-radius: 8px; color: var(--muted); }
  .dado:hover, .dado:active { color: var(--text); background: var(--raise); }
  .sec { padding: 10px 18px 0; color: var(--faint); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; }
  .rolar { max-height: 38vh; overflow-y: auto; padding-bottom: 6px; }
  /* ferramentas: no celular, uma linha de nomes e só o controle escolhido (o painel não cresce e a foto não encolhe) */
  .ferramentas { display: flex; gap: 20px; padding: 6px 18px 2px; overflow-x: auto; scrollbar-width: none; }
  .ferramentas::-webkit-scrollbar { display: none; }
  .ferramentas button { position: relative; flex: 0 0 auto; color: var(--muted); font-size: 13px; white-space: nowrap; padding: 6px 0; }
  .ferramentas button.on { color: var(--text); box-shadow: inset 0 -1px 0 var(--text); }
  .ferramentas button.mudou::after { content: ''; position: absolute; top: 3px; right: -6px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .grupo { display: none; } .grupo.on { display: block; }
  .ferramentas button.fam { margin-left: 10px; } .ferramentas button.fam::before { content: ''; position: absolute; left: -16px; top: 9px; bottom: 9px; width: 1px; background: var(--line); }
  .ctl.linha { grid-template-columns: 84px minmax(0, 1fr) 54px; align-items: center; padding: 2px 18px; }
  .ctl.linha input { grid-column: auto; } .ctl.linha output { text-align: right; }
  .cores { display: flex; gap: 12px; padding: 8px 18px 4px; }
  .cores button { position: relative; width: 26px; height: 26px; border-radius: 50%; flex: none; outline: 2px solid transparent; outline-offset: 2px; }
  .cores button.on { outline-color: var(--text); }
  .cores { align-items: center; gap: 9px; } .cores button { width: 22px; height: 22px; }
  .cores .qual { margin-left: auto; color: var(--muted); font-size: 12px; white-space: nowrap; }
  /* aba Filmes: Intensidade · Puxar · Vencido numa linha; o controle numa linha só (o nome já está na ferramenta) */
  #cIntensidade .ferramentas { padding-top: 2px; }
  #cIntensidade .ctl { display: flex; align-items: center; gap: 10px; padding: 2px 18px 4px; }
  #cIntensidade .ctl label { display: none; } #cIntensidade .ctl input { order: -1; flex: 1; min-width: 0; }
  #cIntensidade .ctl output { min-width: 46px; text-align: right; }
  .cores button.mudou::after { content: ''; position: absolute; top: -5px; right: -5px; width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .canais, .acoes { display: flex; gap: 6px; padding: 8px 18px 4px; overflow-x: auto; scrollbar-width: none; }
  .canais::-webkit-scrollbar, .acoes::-webkit-scrollbar, .props div::-webkit-scrollbar { display: none; }
  .canais button, .acoes button { flex: none; padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; white-space: nowrap; }
  .canais button.on, .acoes button.on { color: var(--text); border-color: var(--accent); }
  .canais .zerar { margin-left: auto; border-color: transparent; }
  .dica { display: block; padding: 4px 18px; color: var(--muted); font-size: 11.5px; }
  .props div { overflow-x: auto; scrollbar-width: none; } .props button { flex: 0 0 auto; padding: 6px 12px; white-space: nowrap; }
  #g_corte .escolha { padding: 4px 18px; }
  .so-pc { display: none; }
  /* Enquadrar: o painel vira a ferramenta (ícones, proporções ou régua, ✕ e ✓) */
  #enq { display: none; }
  body.enquadrando .abas, body.enquadrando .conteudo { display: none; }
  body.enquadrando #enq { display: flex; flex-direction: column; justify-content: space-between; min-height: 255px; }
  .enq-ferr { display: flex; justify-content: space-between; padding: 12px 12px 4px; gap: 2px; }
  .enq-ferr button { position: relative; flex: 1; display: grid; justify-items: center; gap: 4px; padding: 6px 0; color: var(--muted); font-size: 11px; border-radius: 10px; }
  .enq-ferr button.on { color: var(--text); background: var(--raise); }
  .enq-ferr button.mudou::after { content: ''; position: absolute; top: 4px; right: calc(50% - 18px); width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
  .enq-meio { padding: 6px 0; }
  .enq-props { display: flex; gap: 6px; padding: 4px 16px; overflow-x: auto; scrollbar-width: none; } .enq-props::-webkit-scrollbar { display: none; }
  .enq-props button { flex: none; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; }
  .enq-props button.on { color: var(--text); border-color: var(--accent); }
  .enq-props .deita { margin-left: auto; font-size: 16px; padding: 4px 12px; }
  .regua { display: grid; justify-items: center; gap: 2px; }
  .regua output { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; min-height: 18px; }
  .regua .trilho { position: relative; width: 100%; height: 44px; overflow: hidden; touch-action: none; cursor: ew-resize;
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); mask-image: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent); }
  .regua .marcas { position: absolute; top: 0; left: 0; height: 100%; }
  .regua .marcas i { position: absolute; top: 4px; width: 1px; height: 9px; background: var(--faint); }
  .regua .marcas i.g { height: 16px; background: var(--muted); }
  .regua .marcas b { position: absolute; top: 24px; transform: translateX(-50%); font-weight: 400; font-size: 10px; color: var(--faint); }
  .regua .agulha { position: absolute; left: 50%; top: 0; width: 2px; height: 22px; margin-left: -1px; background: var(--accent); }
  .enq-fim { display: flex; justify-content: space-between; align-items: center; padding: 4px 10px calc(4px + var(--safe-b)); border-top: 1px solid var(--line); }
  .enq-fim button { min-width: 56px; height: 44px; font-size: 20px; color: var(--text); }
  .enq-fim .restaura { font-size: 13px; color: var(--muted); }
  #moldCorte .caixa.fina { background-image: linear-gradient(#fff3 1px, transparent 1px), linear-gradient(90deg, #fff3 1px, transparent 1px); background-size: 12.5% 12.5%; }
  #curva { display: block; width: 100%; aspect-ratio: 1; touch-action: none; }
  #curva.na-foto { position: absolute; aspect-ratio: auto; background: #0005; z-index: 3; }
  #curva .grade line { stroke: #fff3; stroke-width: 1; } #curva polyline { fill: none; stroke-width: 2; } #curva .outra { stroke-width: 1; opacity: .55; }
  #curva circle { fill: #0009; stroke-width: 2; }
  #g_curvas > #curva { display: none; }
  /* Seletivo: os pontos sobre a foto e o painel */
  #pontos { position: absolute; display: none; z-index: 3; touch-action: none; }
  #pontos .pt { position: absolute; width: 0; height: 0; }
  #pontos .pt b { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 600;
    background: #000a; color: #fff; border: 1.5px solid #fffc; box-shadow: 0 0 0 1px #0006; }
  #pontos .pt.sel b { background: var(--accent); color: #111; border-color: #fff; }
  #pontos .aro { position: absolute; left: 0; top: 0; border-radius: 50%; border: 1.5px solid #fffd; box-shadow: 0 0 0 1px #0006, inset 0 0 0 1px #0006; pointer-events: none; }
  #pontos .aro::before { content: ''; position: absolute; right: -6px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #0007; }
  .selParams { display: flex; gap: 6px; padding: 6px 18px 2px; overflow-x: auto; scrollbar-width: none; } .selParams::-webkit-scrollbar { display: none; }
  .selParams button { position: relative; flex: none; padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; }
  .selParams button.on { color: var(--text); border-color: var(--accent); } .selParams button:disabled { opacity: .45; }
  .selParams button.mudou::after { content: ''; position: absolute; top: 3px; right: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
  .selAcoes { display: flex; align-items: center; gap: 8px; padding: 2px 18px 4px; }
  .selAcoes button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--muted); font-size: 13px; }
  .selAcoes button.on { color: var(--text); border-color: var(--accent); } .selAcoes .apaga { color: #e58a7a; border-color: transparent; }
  .selAcoes .dica { padding: 0; }
  #g_sel .ctl.linha { padding: 4px 18px; }
  .grupo[data-g=flash] .ctl { padding-top: 3px; padding-bottom: 3px; } #e_flashEstilo { padding: 4px 18px; } #e_flashEstilo button { padding: 5px 4px; }
  #e_flashEstilo small { display: none; }   /* no celular o nome do estilo basta (o painel não cresce) */
  /* rótulo da família, entre os grupos de receitas */
  .film.rotulo { width: 22px; align-self: stretch; display: grid; place-items: center; color: var(--faint); font-size: 10px; letter-spacing: .14em; text-transform: uppercase; }
  .film.rotulo span { writing-mode: vertical-rl; transform: rotate(180deg); white-space: nowrap; }
  /* dica de primeira vez */
  #dica { position: absolute; left: 50%; top: 14px; transform: translate(-50%, -8px); z-index: 11; display: flex; align-items: center; gap: 12px; width: max-content; max-width: min(calc(100vw - 40px), 440px);
    background: var(--raise); color: var(--text); border: 1px solid var(--line); border-radius: 12px; padding: 10px 10px 10px 14px; font-size: 13px; line-height: 1.35;
    box-shadow: 0 8px 30px #0008; opacity: 0; pointer-events: none; transition: opacity .25s, transform .25s; }
  #dica.on { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
  #dica button { flex: none; color: var(--accent); font-size: 13px; padding: 6px 8px; }
  /* folha: sobe por cima dos controles (não muda a altura da tela) */
  #veu { position: fixed; inset: 0; background: #0007; z-index: 20; display: none; }
  #folha { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; background: var(--panel); border-top: 1px solid var(--line); border-radius: 16px 16px 0 0;
    padding: 18px 18px calc(16px + var(--safe-b)); transform: translateY(105%); transition: transform .22s ease; max-height: 80vh; overflow-y: auto; }
  body.com-folha #veu { display: block; } body.com-folha #folha { transform: none; }
  .ficha h3 { margin: 0 0 6px; font-weight: 500; font-size: 20px; letter-spacing: .01em; }
  .ficha .alma { margin: 0 0 12px; color: var(--muted); font-size: 13.5px; line-height: 1.45; }
  .ficha dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0 0 14px; font-size: 13px; }
  .ficha dt { color: var(--faint); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; padding-top: 2px; } .ficha dd { margin: 0; color: var(--text); }
  .ficha .campo { width: 100%; box-sizing: border-box; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; color: var(--text); font: inherit; font-size: 15px; padding: 10px 12px; margin-bottom: 12px; }
  .ficha .codigo { font-family: ui-monospace, Menlo, monospace; font-size: 12px; resize: none; word-break: break-all; }
  .ficha .botoes { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .ficha .botoes button { min-height: 44px; padding: 0 16px; border-radius: 10px; font-size: 14px; color: var(--text); border: 1px solid var(--line); }
  .ficha .botoes .pri { background: var(--text); color: var(--bg, #111); border-color: transparent; font-weight: 600; }
  .ficha .botoes .apaga { margin-right: auto; color: #e58a7a; border-color: transparent; }
  .ficha .formatos { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
  .ficha .formatos button { display: grid; gap: 3px; text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; color: var(--muted); }
  .ficha .formatos button b { font-weight: 500; font-size: 15px; color: var(--text); } .ficha .formatos button small { font-size: 12px; }
  .ficha .formatos button.on { border-color: var(--accent); }
  .ficha .opcao { display: grid; gap: 3px; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 8px; border: 1px solid var(--line); border-radius: 12px; color: var(--text); }
  .ficha .opcao b { font-weight: 500; font-size: 15px; } .ficha .opcao small { color: var(--muted); font-size: 12.5px; }
  .ficha .opcao:hover { border-color: var(--accent); }
  .film.acao .ph { font-size: 30px; font-weight: 200; color: var(--muted); border: 1px dashed var(--line); background: transparent; }
  /* cortina: antes | depois */
  #cortina { position: absolute; display: none; z-index: 4; touch-action: none; cursor: ew-resize; }
  #cortina i { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; box-shadow: 0 0 0 1px #0005; }
  #cortina i::after { content: '‹ ›'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 34px; height: 34px; border-radius: 50%; background: #fff; color: #111;
    display: grid; place-items: center; font-size: 15px; letter-spacing: 2px; box-shadow: 0 1px 8px #0006; }
  #cortina span { position: absolute; top: 8px; font-size: 10.5px; letter-spacing: .14em; color: #fff; text-shadow: 0 1px 4px #000b; pointer-events: none; }
  #cortina .ant { left: 10px; } #cortina .dep { right: 10px; }
  #bComparar.on { color: var(--accent); }
  /* mira: o assunto (círculo) e a linha do horizonte, sobre a foto */
  #mira { position: absolute; display: none; z-index: 3; touch-action: none; cursor: crosshair; }
  #mira .alvo { position: absolute; width: 46px; height: 46px; margin: -23px; border-radius: 50%; border: 1.5px solid #fffd; box-shadow: 0 0 0 1px #0006, inset 0 0 0 1px #0006; pointer-events: none; }
  #mira .alvo::before { content: ''; position: absolute; right: -6px; top: 50%; width: 10px; height: 10px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 1px #0007; }   /* alça: arrastar a borda muda o tamanho */
  #mira .alvo::after { content: ''; position: absolute; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: #fff; }
  #mira .horizonte { position: absolute; left: 0; right: 0; height: 0; border-top: 1.5px dashed #fffc; box-shadow: 0 0 0 .5px #0005; cursor: ns-resize; }
  #mira .horizonte span { position: absolute; right: 6px; top: -20px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #fff; text-shadow: 0 1px 4px #000a; }
  #g_ampl .ctl.linha { padding: 1px 18px; }
  #moldCorte { position: absolute; display: none; z-index: 3; touch-action: none; }   /* sem cortar as alças da borda: o escurecido em volta fica no palco */
  #moldCorte .caixa { position: absolute; box-shadow: 0 0 0 9999px #000a; outline: 1px solid #fffd; cursor: move; }
  #moldCorte i { position: absolute; background: #fff5; pointer-events: none; }
  #moldCorte .t1, #moldCorte .t2 { top: 0; bottom: 0; width: 1px; } #moldCorte .t1 { left: 33.33%; } #moldCorte .t2 { left: 66.67%; }
  #moldCorte .t3, #moldCorte .t4 { left: 0; right: 0; height: 1px; } #moldCorte .t3 { top: 33.33%; } #moldCorte .t4 { top: 66.67%; }
  #moldCorte b { position: absolute; width: 28px; height: 28px; margin: -14px; }
  #moldCorte b::after { content: ''; position: absolute; inset: 10px; background: #fff; border-radius: 2px; }
  #moldCorte b[data-h=n] { left: 50%; top: 0; cursor: ns-resize; } #moldCorte b[data-h=s] { left: 50%; top: 100%; cursor: ns-resize; }
  #moldCorte b[data-h=e] { left: 100%; top: 50%; cursor: ew-resize; } #moldCorte b[data-h=w] { left: 0; top: 50%; cursor: ew-resize; }
  #moldCorte b[data-h=nw] { left: 0; top: 0; cursor: nwse-resize; } #moldCorte b[data-h=se] { left: 100%; top: 100%; cursor: nwse-resize; }
  #moldCorte b[data-h=ne] { left: 100%; top: 0; cursor: nesw-resize; } #moldCorte b[data-h=sw] { left: 0; top: 100%; cursor: nesw-resize; }
  .grupo .sec { display: none; }
  #nota { display: none; }   /* celular: a descrição do filme aparece de passagem ao escolher (economiza a altura) */
  .cats { padding: 6px 16px 6px; }
  .film { width: 66px; } .film canvas, .film .ph { width: 66px; height: 66px; }
  .conteudo { min-height: 213px; }   /* a altura da aba Filmes: trocar de aba ou de ferramenta não mexe na foto */
  #g_retrato .escolha { grid-template-columns: auto minmax(0, 1fr); align-items: center; gap: 12px; padding: 2px 18px; }
  #g_retrato .ctl { padding: 1px 18px; }
  #g_retrato .escolha button { flex: none; padding: 5px 14px; }
  #g_retrato .escolha small, #e_luzTipo small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #e_luzTipo div { overflow-x: auto; scrollbar-width: none; } #e_luzTipo div::-webkit-scrollbar { display: none; }
  #e_luzTipo button { flex: 0 0 auto; padding: 6px 12px; white-space: nowrap; }
  #e_graoTipo { padding: 2px 18px 4px; gap: 4px; } #e_graoTipo small { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #e_graoTipo button { padding: 5px 4px; }
  .grupo[data-g=grao] .ctl { padding-top: 3px; padding-bottom: 3px; }

  input[type=range] { -webkit-appearance: none; appearance: none; height: 26px; background: transparent; margin: 0; touch-action: pan-y; }
  input[type=range]::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--line) calc(9px + (100% - 18px) * var(--a, 0)), var(--text) 0 calc(9px + (100% - 18px) * var(--b, 0)), var(--line) 0); }
  input[type=range]::-moz-range-track { height: 2px; border-radius: 2px; background: linear-gradient(90deg, var(--line) calc(9px + (100% - 18px) * var(--a, 0)), var(--text) 0 calc(9px + (100% - 18px) * var(--b, 0)), var(--line) 0); }
  /* o número grande sobre a foto enquanto arrasta */
  #numero { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; pointer-events: none; color: #fff; font-size: 64px; font-weight: 200;
    letter-spacing: .02em; text-shadow: 0 2px 18px #0009; opacity: 0; transition: opacity .25s; white-space: nowrap; font-variant-numeric: tabular-nums; }
  #numero small { display: block; text-align: center; font-size: 13px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: var(--text); margin-top: -8px; border: 0; }
  input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%; background: var(--text); border: 0; }

  @media (min-width: 900px) {
    body { grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr); }

    #folha { left: auto; right: 0; width: 360px; border-left: 1px solid var(--line); border-radius: 16px 0 0 0; }

  }
</style>

<body>
<header>
  <div class="grp">
    <button class="ib" id="bAbrir" title="Abrir foto" aria-label="Abrir foto"></button>
    <span class="marca">REVELA</span>
  </div>
  <div class="grp">
    <button class="ib" id="bDesfazer" title="Desfazer" aria-label="Desfazer" disabled></button>
    <button class="ib" id="bRefazer" title="Refazer" aria-label="Refazer" disabled></button>
    <button class="ib" id="bComparar" title="Segure para ver a foto original" aria-label="Comparar com a original" disabled></button>
    <button class="ib" id="bLote" title="Aplicar esta edição a várias fotos" aria-label="Aplicar esta edição a várias fotos" disabled></button>
    <button class="exportar" id="bExportar" disabled>Exportar</button>
  </div>
</header>

<main id="palco">
  <canvas id="tela"></canvas>
  <div id="vazio">
    <h1>REVELA</h1>
    <p>Sua foto digital, revelada em filme.</p>
    <button id="bAbrir2">Abrir uma foto</button>
    <small class="versao">versão 49 · 20/11/2026</small>
  </div>
  <div id="selo">ORIGINAL</div>
  <div id="aviso"></div>
  <div id="pergunta" role="dialog" aria-live="polite"><span>Usar a mesma edição da foto anterior?</span><div><button id="pNao">Não</button><button id="pSim" class="on">Usar</button></div></div>
</main>

<section id="painel">
  <nav class="abas">
    <button data-p="filmes" class="on">Filmes</button>
    <button data-p="ajustes">Ajustes</button>
    <button data-p="analogico">Analógico</button>
  </nav>
  <div class="conteudo">
    <div class="pag on" id="p-filmes">
      <div class="cats" id="cats"></div>
      <div class="faixa" id="faixa"></div>
      <div class="nota" id="nota"></div>
      <div class="ctl" id="cIntensidade"></div>
    </div>
    <div class="pag rolar" id="p-ajustes"></div>
    <div class="pag rolar" id="p-analogico"></div>
  </div>
</section>

<input type="file" id="arquivo" accept="image/*,.heic,.heif,.dng,.raf,.cr2,.cr3,.nef,.arw,.orf,.rw2" hidden>
<input type="file" id="lote" accept="image/*,.heic,.heif,.dng,.raf,.cr2,.cr3,.nef,.arw,.orf,.rw2" multiple hidden>
<script type="module" src="app.js"></script>
</body>
</html>
