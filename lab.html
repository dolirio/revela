<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#131210">
<title>Revela Lab</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#131210; --panel:#1c1a17; --line:#2c2924; --text:#ece6da; --muted:#9a9286; --accent:#e8a33d; --accent-ink:#1a1307; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { display:grid; grid-template-rows:auto minmax(0,1fr) minmax(0,46vh); grid-template-columns:minmax(0,1fr); height:100dvh; overflow:hidden; }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:10px 16px; border-bottom:1px solid var(--line); }
  .brand { font-weight:700; letter-spacing:.14em; text-transform:uppercase; font-size:13px; margin-right:auto; }
  .brand span { color:var(--accent); } .brand a { color:inherit; text-decoration:none; }
  button, select, input[type=text] { font:inherit; color:var(--text); background:transparent; border:1px solid var(--line); border-radius:999px; padding:6px 12px; }
  select, input[type=text] { border-radius:8px; background:var(--panel); }
  button { cursor:pointer; } button.primary { background:var(--accent); color:var(--accent-ink); border-color:var(--accent); font-weight:600; }
  #stage { position:relative; display:grid; place-items:center; padding:10px; min-height:0; overflow:hidden; }
  #view { max-width:100%; max-height:100%; touch-action:none; user-select:none; -webkit-user-select:none; }
  #badge { position:absolute; top:14px; left:14px; background:#000a; padding:3px 9px; border-radius:999px; font-size:12px; display:none; }
  #side { background:var(--panel); border-top:1px solid var(--line); overflow-y:auto; padding:10px 16px 24px; min-width:0; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .bar select { flex:1 1 160px; min-width:0; } .bar input[type=text] { flex:1 1 140px; min-width:0; }
  details { border-top:1px solid var(--line); padding:6px 0; }
  summary { cursor:pointer; padding:6px 0; font-weight:600; color:var(--text); }
  .row { display:grid; grid-template-columns:92px minmax(0,1fr) 42px; gap:8px; align-items:center; min-height:28px; }
  .row label { color:var(--muted); }
  .row output { text-align:right; font-variant-numeric:tabular-nums; color:var(--muted); font-size:12px; }
  input[type=range] { width:100%; accent-color:var(--accent); }
  .zone { border:1px solid var(--line); border-radius:8px; padding:6px 10px; margin:6px 0; }
  .zone-h { display:flex; align-items:center; gap:8px; margin-bottom:4px; }
  .zone-h .sw { width:14px; height:14px; border-radius:50%; }
  .zone-h button { margin-left:auto; padding:2px 10px; }
  .chk { display:flex; gap:8px; align-items:center; margin:6px 0; color:var(--muted); }
  .hint { color:var(--muted); font-size:12px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#000d; padding:8px 14px; border-radius:999px; opacity:0; transition:opacity .2s; pointer-events:none; }
  #toast.on { opacity:1; }
  @media (min-width: 900px) {
    body { grid-template-columns:minmax(0,1fr) 400px; grid-template-rows:auto minmax(0,1fr); }
    header { grid-column:1 / -1; }
    #side { border-top:0; border-left:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div class="brand"><a href="./">Re<span>vela</span></a> · Lab</div>
  <button id="btnOpen">Abrir foto</button>
  <button id="btnExport" class="primary">Exportar looks</button>
  <input id="fileImg" type="file" accept="image/*" hidden>
</header>
<main id="stage"><canvas id="view"></canvas><div id="badge">Original</div></main>
<aside id="side">
  <div class="bar">
    <select id="selLook" aria-label="Look"></select>
    <button id="btnNew">Duplicar</button>
    <button id="btnDel">Excluir</button>
  </div>
  <div class="bar">
    <input type="text" id="inName" aria-label="Nome do look">
    <button id="btnReset">Desfazer edições</button>
  </div>
  <p class="hint">As mudanças são salvas neste aparelho e aparecem no app na hora. Segure a foto para ver o original.</p>
  <div id="controls"></div>
  <details>
    <summary>Restaurar tudo</summary>
    <p class="hint">Apaga todas as edições deste aparelho e volta aos looks do arquivo looks-data.js.</p>
    <button id="btnFactory">Restaurar looks de fábrica</button>
  </details>
</aside>
<div id="toast" role="status"></div>
<script type="module" src="lab.js"></script>
</body>
</html>
