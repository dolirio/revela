<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Revela</title>
<meta http-equiv="refresh" content="0; url=../">
<style>body{margin:0;background:#11100F;color:#EEE7DC;font:15px system-ui,sans-serif;display:grid;place-items:center;height:100vh}a{color:#E2A257}</style>
</head>
<body>
<!-- O Revela agora mora no endereço principal. Quem instalou pelo endereço antigo (/novo/) é levado para lá. -->
<p>O Revela mudou para o endereço principal. <a href="../">Abrir o Revela</a></p>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => { if (r.scope.endsWith('/novo/')) r.unregister(); }));
  location.replace('../' + location.hash);
</script>
</body>
</html>
